<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mono Audio Fixer</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --accent-primary: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-pink: #ec4899;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 320px;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-pink));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .title-group h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .title-group p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Master Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 24px;
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }

    input:checked + .slider-toggle {
      background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    input:checked + .slider-toggle:before {
      transform: translateX(20px);
    }

    /* Section Title */
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    /* Preset Grid */
    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .preset-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
      text-align: center;
    }

    .preset-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .preset-btn.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
    }

    .preset-btn.full-width {
      grid-column: span 2;
      flex-direction: row;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
    }

    .preset-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .preset-label {
      font-size: 12px;
      font-weight: 600;
    }

    .preset-sub {
      font-size: 9px;
      opacity: 0.75;
    }

    /* Sliders Card */
    .control-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .slider-header span {
      font-weight: 500;
      color: var(--text-main);
    }

    .badge-val {
      font-size: 11px;
      font-weight: 600;
      background: #334155;
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--accent-cyan);
    }

    .reset-link {
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    .reset-link:hover {
      color: var(--text-main);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-primary);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.6);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .dot.offline {
      background: #94a3b8;
      box-shadow: none;
    }

    .shortcut-tip {
      font-size: 10px;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 3a9 9 0 0 0-9 9v7c0 1.1.9 2 2 2h3a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5v-1a7 7 0 0 1 14 0v1h-3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/>
        </svg>
      </div>
      <div class="title-group">
        <h1>Mono Audio Fixer</h1>
        <p id="domainLabel">YouTube & Tab Audio</p>
      </div>
    </div>
    <label class="switch" title="Enable / Disable Master Audio Fixer">
      <input type="checkbox" id="masterToggle" checked>
      <span class="slider-toggle"></span>
    </label>
  </div>

  <!-- Audio Modes -->
  <div class="section-title">Audio Preset Modes</div>
  <div class="preset-grid">
    <button class="preset-btn active" data-mode="mono" title="Downmix Stereo to Mono (Fixes single ear audio)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><circle cx="12" cy="12" r="5"/></svg>
      <span class="preset-label">Mono Mix</span>
      <span class="preset-sub">50% L + 50% R</span>
    </button>

    <button class="preset-btn" data-mode="left-only" title="Copy Left ear channel to both ears (Use when Right ear is silent)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 4v16c-4.41 0-8-3.59-8-8s3.59-8 8-8z"/></svg>
      <span class="preset-label">Left Only</span>
      <span class="preset-sub">Left -> Both</span>
    </button>

    <button class="preset-btn" data-mode="right-only" title="Copy Right ear channel to both ears (Use when Left ear is silent)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 4v16c4.41 0 8-3.59 8-8s-3.59-8-8-8z"/></svg>
      <span class="preset-label">Right Only</span>
      <span class="preset-sub">Right -> Both</span>
    </button>

    <button class="preset-btn" data-mode="swap" title="Swap Left and Right channels">
      <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
      <span class="preset-label">Swap L ↔ R</span>
      <span class="preset-sub">Invert Stereo</span>
    </button>

    <button class="preset-btn full-width" data-mode="stereo" title="Normal Stereo Pass-through">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <span class="preset-label">Stereo Normal</span>
    </button>
  </div>

  <!-- Audio Controls -->
  <div class="section-title">Fine-Tuning</div>
  <div class="control-card">
    
    <!-- Balance -->
    <div class="slider-row">
      <div class="slider-header">
        <span>Stereo Balance</span>
        <div>
          <span class="reset-link" id="resetBalance">Reset</span>
          <span class="badge-val" id="balanceVal">Center</span>
        </div>
      </div>
      <input type="range" id="balanceSlider" min="-1" max="1" step="0.05" value="0">
    </div>

    <!-- Volume Booster -->
    <div class="slider-row">
      <div class="slider-header">
        <span>Volume Boost</span>
        <span class="badge-val" id="volumeVal">100%</span>
      </div>
      <input type="range" id="volumeSlider" min="0" max="3" step="0.05" value="1">
    </div>

  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-indicator">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Active video found</span>
    </div>
    <span class="shortcut-tip">Alt+Shift+M</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
